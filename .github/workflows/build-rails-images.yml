---
name: Build Rails-specific Docker Images

on:
  push:
    branches:
      - main
    paths:
      - 'Dockerfile.rails'
      - 'bin/resolve-ruby-versions'
      - 'bin/resolve-rails-matrix'
      - '.github/workflows/build-rails-images.yml'
  workflow_dispatch:
  schedule:
    # Rebuild weekly for security updates and new Ruby/Rails patch releases
    - cron: '0 0 * * 0'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: tastybamboo/panda-ci

concurrency:
  group: ${{ github.event_name == 'schedule' && 'build-rails-scheduled' || format('build-rails-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  resolve-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve Ruby x Rails matrix
        id: resolve
        run: |
          MATRIX=$(bin/resolve-rails-matrix)
          echo "$MATRIX" | jq .
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  build-rails-images:
    needs: resolve-matrix
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.resolve-matrix.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.rails
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:ruby-${{ matrix.ruby }}-rails-${{ matrix.rails }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:ruby-${{ matrix.ruby }}-rails-${{ matrix.series }}
          build-args: |
            RUBY_VERSION=${{ matrix.ruby }}
            RAILS_VERSION=${{ matrix.rails }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Tag as latest for series
        if: github.event_name != 'pull_request' && matrix.series_latest
        run: |
          # Pull the image first so we can tag it locally
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:ruby-${{ matrix.ruby }}-rails-${{ matrix.rails }}

          docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:ruby-${{ matrix.ruby }}-rails-${{ matrix.rails }} \
                    ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:rails-${{ matrix.series }}-latest
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:rails-${{ matrix.series }}-latest

          if [ "${{ matrix.global_latest }}" = "true" ]; then
            docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:ruby-${{ matrix.ruby }}-rails-${{ matrix.rails }} \
                      ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:rails-latest
            docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:rails-latest
          fi

      - name: Test image
        if: github.event_name != 'pull_request'
        run: |
          docker run --rm ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:ruby-${{ matrix.ruby }}-rails-${{ matrix.rails }} ruby -v
          docker run --rm ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:ruby-${{ matrix.ruby }}-rails-${{ matrix.rails }} sh -c 'gem list rails && rails -v'
          docker run --rm ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:ruby-${{ matrix.ruby }}-rails-${{ matrix.rails }} bundler -v
