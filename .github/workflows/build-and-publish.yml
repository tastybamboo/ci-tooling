---
name: Build and Publish Docker Image

on:
  push:
    branches:
      - main
    paths:
      - 'Dockerfile'
      - 'bin/resolve-ruby-versions'
      - '.github/workflows/build-and-publish.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'Dockerfile'
      - 'bin/resolve-ruby-versions'
      - '.github/workflows/build-and-publish.yml'
  workflow_dispatch:
    inputs:
      ruby_versions:
        description: >-
          Override Ruby versions to build (JSON array, e.g.
          ["3.4.10", "4.0.6"]). Leave empty to resolve the latest patch
          release of each supported minor line automatically.
        required: false
        default: ''
      platforms:
        description: 'Platforms to build for'
        required: false
        default: 'linux/amd64'
        type: choice
        options:
          - 'linux/amd64'
          - 'linux/amd64,linux/arm64'
  schedule:
    # Rebuild weekly to get security updates and new Ruby patch releases
    - cron: '0 0 * * 0'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: tastybamboo/panda-ci

concurrency:
  group: ${{ github.event_name == 'schedule' && 'build-ruby-scheduled' || format('build-ruby-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  resolve-versions:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.resolve.outputs.versions }}
      minors: ${{ steps.resolve.outputs.minors }}
      latest: ${{ steps.resolve.outputs.latest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve Ruby versions
        id: resolve
        env:
          RUBY_VERSIONS_OVERRIDE: ${{ github.event.inputs.ruby_versions }}
        run: |
          if [ -n "$RUBY_VERSIONS_OVERRIDE" ]; then
            RESULT=$(bin/resolve-ruby-versions --from-list "$RUBY_VERSIONS_OVERRIDE")
          else
            RESULT=$(bin/resolve-ruby-versions)
          fi
          echo "Resolved: $RESULT"
          {
            echo "versions=$(jq -c '.versions' <<<"$RESULT")"
            echo "minors=$(jq -c '.minors' <<<"$RESULT")"
            echo "latest=$(jq -r '.latest' <<<"$RESULT")"
          } >> "$GITHUB_OUTPUT"

  build-and-push:
    needs: resolve-versions
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        ruby-version: ${{ fromJson(needs.resolve-versions.outputs.versions) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Ruby minor version
        id: minor
        run: echo "minor=$(echo '${{ matrix.ruby-version }}' | cut -d. -f1,2)" >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=ruby-${{ matrix.ruby-version }}
            type=raw,value=ruby-${{ steps.minor.outputs.minor }}
            type=raw,value=ruby-${{ matrix.ruby-version }}-{{date 'YYYYMMDD'}}
            type=raw,value=latest,enable=${{ matrix.ruby-version == needs.resolve-versions.outputs.latest }}
            type=sha,prefix=ruby-${{ matrix.ruby-version }}-,format=short

      - name: Build and push Docker image
        # Platform strategy:
        # - Push/PR: amd64 only (fast, for CI)
        # - Manual: configurable via input
        # - Weekly: both amd64 and arm64 (for local dev)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            RUBY_VERSION=${{ matrix.ruby-version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.platforms || (github.event_name == 'schedule' && 'linux/amd64,linux/arm64' || 'linux/amd64') }}

      - name: Test image
        if: github.event_name != 'pull_request'
        run: |
          docker run --rm ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:ruby-${{ matrix.ruby-version }} ruby -v
          docker run --rm ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:ruby-${{ matrix.ruby-version }} bundler -v
          docker run --rm ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:ruby-${{ matrix.ruby-version }} chromium --version

  update-readme:
    needs: [resolve-versions, build-and-push]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update README with latest tags
        run: |
          DATE=$(date +'%Y%m%d')
          LATEST_MINOR=$(echo '${{ needs.resolve-versions.outputs.latest }}' | cut -d. -f1,2)

          {
            echo "## Available Tags"
            echo ""
            echo "Last updated: $(date +'%Y-%m-%d %H:%M:%S UTC')"

            echo '${{ needs.resolve-versions.outputs.minors }}' | jq -r '.[]' | sort -t. -k1,1nr -k2,2nr | while read -r minor; do
              echo ""
              if [ "$minor" = "$LATEST_MINOR" ]; then
                echo "### Ruby $minor (latest)"
                echo "- \`ghcr.io/tastybamboo/panda-ci:latest\`"
              else
                echo "### Ruby $minor"
              fi
              echo "- \`ghcr.io/tastybamboo/panda-ci:ruby-$minor\`"
              echo "- \`ghcr.io/tastybamboo/panda-ci:ruby-$minor-$DATE\`"
            done
          } > TAGS.md

      - name: Create Pull Request for TAGS update
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "docs: Update available tags [skip ci]"
          branch: automated/update-tags
          delete-branch: true
          title: "docs: Update available tags"
          body: |
            ## Automated TAGS.md Update

            Updated the available Docker image tags list.

            ---
            *This PR was automatically generated after a successful image build.*
